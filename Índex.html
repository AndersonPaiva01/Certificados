<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de Certificado</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            color: #222;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 25px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }

        #resultado {
            margin-top: 25px;
            text-align: left;
        }

        .valido {
            color: green;
            font-weight: bold;
        }

        .invalido {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Validação de Certificado</h1>

    <p>Digite o código do certificado:</p>

    <input
        type="text"
        id="codigo"
        placeholder="Ex: CERT-2026-001"
    >

    <br>

    <button onclick="validarCertificado()">
        Validar certificado
    </button>

    <div id="resultado"></div>

</div>

<script>

const certificados = {

    "CERT-2026-001": {
        nome: "Enderson",
        curso: "Formação Profissional",
        data: "26/09/2026"
    },

    "CERT-2026-002": {
        nome: "Exemplo",
        curso: "Curso de Capacitação",
        data: "26/09/2026"
    }

};

function validarCertificado() {

    const codigo = document
        .getElementById("codigo")
        .value
        .trim()
        .toUpperCase();

    const resultado = document.getElementById("resultado");

    if (certificados[codigo]) {

        const certificado = certificados[codigo];

        resultado.innerHTML = `
            <h2 class="valido">✓ Certificado válido</h2>

            <p><strong>Nome:</strong> ${certificado.nome}</p>

            <p><strong>Curso:</strong> ${certificado.curso}</p>

            <p><strong>Data de emissão:</strong> ${certificado.data}</p>

            <p><strong>Código:</strong> ${codigo}</p>
        `;

    } else {

        resultado.innerHTML = `
            <p class="invalido">
                ✕ Certificado não encontrado.
            </p>
        `;

    }
}

</script>

</body>
</html>
